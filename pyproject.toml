[project]
name = "sukpago"
version = "0.1.0"
description = "강의를 실시간으로 몽골어·중국어·영어로 번역하는 프로그램"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1",
  "ctranslate2==4.9.1",
  "sentencepiece==0.2.3",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "psutil>=6.0",
  "customtkinter>=5.2",
  "miniaudio>=1.61",
  "edge-tts>=7.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sukpago"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
markers = ["models: models/ 폴더의 실제 모델이 필요함 (없으면 건너뜀)"]
